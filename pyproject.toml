[project]
name = "convox-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Poojitha Irosha", email = "poojithairosha9311@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "docling>=2.149.0",
    "faststream[kafka]>=0.7.8",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.2.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
convox-ai = "convox_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'SIM', 'ASYNC', 'S', 'RUF']

[tool.mypy]
strict = true
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
markers = ['integration: needs Docker', 'eval: calls real models']

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[kafka,postgres]>=4.15.0",
]
eval = [
    "deepeval>=4.3.3",
]
